AWSTemplateFormatVersion: '2010-09-09'
Description: AWS-study Template
# CloudFormation template for AWS study
Resources:

  cfnVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: aws-study-vpc

  cfnSubnetAZ1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref cfnVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: ap-northeast-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: aws-study-subnet1a

  cfnSubnetAZ1c:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref cfnVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: ap-northeast-1c
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: aws-study-subnet1c

  cfnInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: aws-study-gw

  cfnGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref cfnVPC
      InternetGatewayId: !Ref cfnInternetGateway

  cfnRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref cfnVPC
      Tags:
        - Key: Name
          Value: aws-study-route

  cfnRouteInternet:
    Type: AWS::EC2::Route
    DependsOn: cfnGatewayAttachment
    Properties:
      RouteTableId: !Ref cfnRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref cfnInternetGateway

  cfnRouteLocal1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref cfnRouteTable
      SubnetId: !Ref cfnSubnetAZ1a

  cfnRouteLocal2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref cfnRouteTable
      SubnetId: !Ref cfnSubnetAZ1c

  # Security Group
  cfnSecurityGroupEC2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AWS Study EC2
      VpcId: !Ref cfnVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: aws-study-securityGroup-ec2

  cfnSecurityGroupRDS:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AWS Study RDS
      VpcId: !Ref cfnVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref cfnSecurityGroupEC2

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: aws-study-securityGroup-rds

  # EC2 (Amazon Linux 2023, t2.micro)
  cfnEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: amazon/al2023-ami-2023.12.20261102.0-kernel-6.18-x86_64
      InstanceType: t2.micro
      SubnetId: !Ref cfnSubnetAZ1a
      DisableApiTermination: false
      InstanceInitiatedShutdownBehavior: stop
      KeyName: awsstudyv2
      Monitoring: false
      SecurityGroupIds:
        - !Ref cfnSecurityGroupEC2

      Tags:
        - Key: Name
          Value: aws-study-ec2

  # RDS
  cfnRDS:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 20
      AllowMajorVersionUpgrade: false
      AutoMinorVersionUpgrade: true
      DBInstanceClass: db.t4g.micro
      Port: 3306
      StorageType: gp2
      BackupRetentionPeriod: 1
      MasterUsername: root
      MasterUserPassword: rootroot
      PreferredBackupWindow: 15:00-16:00
      PreferredMaintenanceWindow: sun:18:00-sun:19:00
      DBName: awsstudy
      Engine: mysql
      EngineVersion: "8.0.41"
      LicenseModel: general-public-license
      DBSubnetGroupName: !Ref cfnDBSubnetGroup
      VPCSecurityGroups:
        - !Ref cfnSecurityGroupRDS
      Tags:
        - Key: Name
          Value: aws-study-rds

  cfnDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Created from CloudFormation
      SubnetIds:
        - !Ref cfnSubnetAZ1a
        - !Ref cfnSubnetAZ1c

  # ELB
  cfnELB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: aws-study-elb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref cfnSecurityGroupEC2
      Subnets:
        - !Ref cfnSubnetAZ1a
        - !Ref cfnSubnetAZ1c

      Tags:
        - Key: Name
          Value: aws-study-elb

  cfnELBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: aws-study-elb-target-group
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref cfnVPC
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckTimeoutSeconds: 5
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 10
      Matcher:
        HttpCode: 200

      Targets:
        - Id: !Ref cfnEC2
          Port: 8080

      Tags:
        - Key: Name
          Value: aws-study-elb-target-group

  cfnELBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref cfnELB
      DefaultActions:
        - TargetGroupArn: !Ref cfnELBTargetGroup
          Type: forward
      Port: 80
      Protocol: HTTP 
